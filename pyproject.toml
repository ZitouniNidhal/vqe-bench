# pyproject.toml
[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vqe-bench"
version = "0.1.0"
description = "Variational Quantum Eigensolver Benchmark Suite: ansätze, optimisers, barren-plateau diagnostics, and zero-noise extrapolation on molecules and spin models."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "vqe-bench contributors" }]
keywords = ["quantum computing", "VQE", "benchmark", "qiskit", "error mitigation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "qiskit>=1.3,<2",
    "qiskit-aer>=0.14",
    "qiskit-algorithms>=0.3",   # SPSA optimiser (stable, still maintained alongside qiskit 1.x)
]

[project.optional-dependencies]
chemistry = [
    "qiskit-nature>=0.7,<0.8",
    "pyscf>=2.5",
]
mitiq = ["mitiq>=0.37"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "jupyter>=1.0",
    "notebook>=7.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=3.0",
]

[project.scripts]
vqe-bench = "vqe_bench.cli.main:app"   # typer CLI entry point

[tool.hatch.build.targets.wheel]
packages = ["src/vqe_bench"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ANN"]
ignore = ["ANN101", "ANN102"]  # self/cls annotations

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN201"]  # tests may omit return annotations

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=vqe_bench --cov-report=term-missing"
filterwarnings = ["ignore::DeprecationWarning:qiskit.*:"]